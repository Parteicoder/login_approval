name: login_approval
description: An "Is this you signing in?" sheet with number matching for Flutter. Polls your backend and hands the decision back to your app. UI only, no networking, no crypto.
version: 0.1.0
repository: https://github.com/Parteicoder/login_approval
issue_tracker: https://github.com/Parteicoder/login_approval/issues
topics:
  - authentication
  - two-factor-authentication
  - security
  - mfa
  - widget

environment:
  sdk: ^3.13.2
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
